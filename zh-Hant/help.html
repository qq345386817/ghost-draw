<main><section class="section"><p class="kicker">幫助</p><h1>如何使用靈魂畫手</h1><div class="plain-list"><article><h3>1. 挑選挑戰</h3><p>使用每日題目或選擇隨機關卡。題目刻意設定得很古怪，好讓揭曉時充滿個性。</p></article><article><h3>2. 盲畫</h3><p>筆刷游標會跟隨你的手指，但墨水會保持隱藏。你可以在繪畫前或過程中切換工具、顏色與筆刷大小。</p></article><article><h3>3. 召喚揭曉</h3><p>「靈魂畫手」會重播你記錄的筆觸，並將隱藏的畫作轉化為成果卡片。</p></article><article><h3>4. 儲存或分享</h3><p>儲存成果圖片、將喜愛的畫作存在畫廊，或分享會循環播放繪畫過程的線上重播連結。</p></article></div><div class="download-strip"><div><strong>獲取靈魂畫手</strong><p>可在 iPhone 的 App Store 下載。</p></div><a class="button primary" href="https://apps.apple.com/app/id6773654307"><img class="store-icon" src="../images/app-store-icon.svg" alt="">App Store</a></div></section></main><footer class="footer"><span>需要幫助嗎？</span><a href="support.html">聯絡支援</a></footer></div></body>
