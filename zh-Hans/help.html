      <section class="section">
        <p class="kicker">帮助</p>
        <h1>Ghost Draw 怎么玩</h1>
        <div class="plain-list">
          <article>
            <h3>1. 选择题目</h3>
            <p>使用每日题目，或选择随机难度。题目会故意带一点怪，这样揭晓时更有性格。</p>
          </article>
          <article>
            <h3>2. 开始盲画</h3>
            <p>画笔光标会跟着手指移动，但墨迹保持隐藏。你可以在作画前或作画中切换工具、颜色和笔刷大小。</p>
          </article>
          <article>
            <h3>3. 召唤幽灵</h3>
            <p>Ghost Draw 会重新播放记录的笔画，把隐藏画作变成结果卡。</p>
          </article>
          <article>
            <h3>4. 保存或分享</h3>
            <p>保存结果图、把喜欢的作品收藏到画廊，或分享一个循环播放绘制过程的回放网页。</p>
          </article>
        </div>
      </section>
    </main>
