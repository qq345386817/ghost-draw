<main><section class="section"><p class="kicker">帮助</p><h1>如何使用 幽灵画手</h1><div class="plain-list"><article><h3>1. 选择挑战</h3><p>使用每日题目，或选择一个随机难度。题目会故意有点怪，这样揭晓时更有个性。</p></article><article><h3>2. 开始盲画</h3><p>画笔光标会跟随手指，但真正的线条会隐藏。开画前或过程中都可以切换工具、颜色和画笔大小。</p></article><article><h3>3. 召唤揭晓</h3><p>幽灵画手 会重放你记录下来的每一笔，把隐藏画作变成结果卡。</p></article><article><h3>4. 保存或分享</h3><p>保存结果图，把喜欢的作品留在画廊，或分享循环播放绘制过程的在线回放链接。</p></article></div><div class="download-strip"><div><strong>下载 幽灵画手</strong><p>已可在 iPhone App Store 获取。</p></div><a class="button primary" href="https://apps.apple.com/app/id6773654307"><img class="store-icon" src="../images/app-store-icon.svg" alt="">App Store</a></div></section></main><footer class="footer"><span>需要帮助？</span><a href="support.html">联系支持</a></footer></div></body>
